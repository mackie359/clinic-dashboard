<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e9f1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#061a19" media="(prefers-color-scheme: dark)">
<title>Dashboard คลินิก</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0e7c76; --teal-d:#075652; --teal-s:#e3f1f0; --teal-m:#8fc7c3; --gold:#b5872a; --gold-s:#f7efdf;
  --page:#f4f7f6; --surf:#ffffff; --sub:#eef2f1; --bd:#e1e8e6;
  --tx:#14302e; --tx2:#566865; --tx3:#8b9a98; --on:#ffffff; --on2:#b9dcd9;
  --loss:#c0392b; --loss-s:#fbe9e6; --warn:#b86a0c; --warn-s:#fdf0d9;
  --seg-doc:#075652; --seg-nurse:#8fc7c3; --seg-med:#0e7c76; --seg-ovh:#c9d3d1; --seg-profit:#b5872a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Thai','Sarabun',-apple-system,'Thonburi',sans-serif;background:var(--page);color:var(--tx);font-size:14px;line-height:22px}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
h1{font-size:22px;line-height:32px;font-weight:600}
h2{font-size:15px;line-height:22px;font-weight:600}
.cap{font-size:12px;line-height:18px;color:var(--tx3)}
.desk{display:none}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- โครง ---------- */
.side{display:none}
.mhead{background:var(--teal-d);color:var(--on);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 24px;display:flex;flex-direction:column;gap:18px}
.mh-top{display:flex;align-items:center;gap:8px}
.mh-top .t{flex:1}
.mh-top .t small{display:block;font-size:12px;line-height:18px;font-weight:500;color:var(--on2)}
.mh-top .t b{font-size:22px;line-height:32px;font-weight:600}
.upd{display:flex;align-items:center;gap:5px;background:var(--teal);border-radius:999px;padding:5px 10px 5px 8px;font-size:10px;line-height:14px;font-weight:500;white-space:nowrap}
.upd svg{width:12px;height:12px}
button.upd{border:0;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rf-btn{display:flex;align-items:center;gap:6px;margin-top:10px;padding:7px 12px;border:0;border-radius:999px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;background:var(--glass-s,rgba(255,255,255,.5));color:var(--tx,inherit);box-shadow:inset 0 1px 0 var(--edge,rgba(255,255,255,.6))}
.rf-btn svg{width:14px;height:14px}
[data-refresh][data-state=run] .rf-i{animation:rfspin 1s linear infinite}
[data-refresh][data-state=run]{opacity:.85;pointer-events:none}
[data-refresh][data-state=ok]{color:#1f8a4c}
@keyframes rfspin{to{transform:rotate(360deg)}}
.seg{display:flex;gap:4px;background:var(--teal);border-radius:12px;padding:4px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;border-radius:9px;font-weight:500;color:var(--on)}
.seg svg{width:16px;height:16px}
.badge{background:var(--loss);color:#fff;border-radius:999px;font-size:10px;line-height:14px;font-weight:500;padding:1px 6px}
.hero small{display:block;font-size:12px;line-height:18px;color:var(--on2)}
.hero b{display:block;font-size:40px;line-height:48px;font-weight:600;margin:4px 0}
.hero .pills{display:flex;gap:8px;flex-wrap:wrap}
.hero .h2{display:flex;background:var(--teal);border-radius:12px;margin:10px 0 8px}
.ht{flex:1;padding:8px 14px;min-width:0}
.ht + .ht{border-left:1px solid rgba(255,255,255,.18)}
.ht span{display:block;font-size:12px;line-height:18px;color:var(--on2)}
.hero .ht b{font-size:20px;line-height:28px;margin:0;white-space:nowrap}
main{padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.page{display:flex;flex-direction:column;gap:16px}
body[data-page="rev"] #page-med, body[data-page="med"] #page-rev,
body[data-page="rev"] .hero-med, body[data-page="med"] .hero-rev{display:none}
body[data-page="rev"] [data-go="rev"], body[data-page="med"] [data-go="med"]{background:var(--surf);color:var(--teal-d)}
.row2{display:contents}
#labor{order:1} #ncd{order:2} #where{order:3} #month{order:4} #chart{order:5} .foot{order:9}

/* ---------- ชิ้นส่วน ---------- */
.card{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chead{display:flex;align-items:center;gap:8px}
.chead h2{flex:1}
.chead svg{color:var(--teal)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;line-height:18px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--teal-s);color:var(--teal-d)} .pill.loss{background:var(--loss-s);color:var(--loss)}
.pill.warn{background:var(--warn-s);color:var(--warn)} .pill.neutral{background:var(--sub);color:var(--tx2)}
.pos{color:var(--teal)} .neg{color:var(--loss)}
.btn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:10px 12px;border-radius:10px;background:var(--teal-s);color:var(--teal-d);font-weight:500}
.empty{color:var(--tx3);padding:8px 0}

/* กล่องรายวัน */
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daybox{border-radius:12px;padding:12px 14px;background:var(--teal-s);border-left:4px solid var(--teal);min-width:0}
.daybox.neg{background:var(--loss-s);border-left-color:var(--loss);color:inherit}
.daybox.hero-box{display:none}
.db-date{font-size:12px;line-height:18px;color:var(--tx2)}
.db-amt{font-size:22px;line-height:30px;font-weight:600;color:var(--teal-d)}
.daybox.neg .db-amt{color:var(--loss)}
.db-formula{display:none}
.db-nurse{font-size:12px;line-height:18px;color:var(--tx3)}

/* ย้อนหลัง */
.hist-h{display:flex;align-items:center;gap:6px;padding-top:4px}
.hist-h h2{flex:1}
.hist{max-height:372px;overflow-y:auto;padding-right:8px;-webkit-overflow-scrolling:touch}
.hmonth,.hrow{display:grid;grid-template-columns:1fr auto;column-gap:8px;align-items:center}
.hmonth{position:sticky;top:0;z-index:1;background:var(--sub);border-radius:8px;padding:8px 12px;margin:8px 0 4px}
.hmonth:first-child{margin-top:0}
.hmonth b{font-weight:500} .hmonth .hm-n{font-size:12px;color:var(--tx2);margin-left:8px}
.hmonth .hm-tot{font-weight:500;color:var(--teal-d)}
.hrow{padding:9px 2px;border-top:1px solid var(--bd);grid-template-areas:"date rem" "nurse formula"}
.hmonth + .hrow{border-top:none}
.h-date{grid-area:date;font-weight:500} .h-nurse{grid-area:nurse;font-size:12px;line-height:18px;color:var(--tx2)}
.h-rem{grid-area:rem;text-align:right;font-size:17px;line-height:26px;font-weight:600}
.h-formula{grid-area:formula;text-align:right;font-size:12px;line-height:18px;color:var(--tx3)}
.h-rev,.h-doc,.h-nc,.hm-c,.hcols{display:none}

/* NCD */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:12px;background:var(--sub);padding:10px 8px;text-align:center}
.tile b{display:block;font-size:22px;line-height:30px;font-weight:600}
.tile span{font-size:12px;line-height:18px;color:var(--tx2)}
.tile.hot{background:var(--warn-s)} .tile.hot b{color:var(--warn)}
.brow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.brow span:first-child{flex:1}
.lock{display:flex;align-items:center;gap:10px;background:var(--sub);border-radius:10px;padding:10px 12px}
.lock svg{color:var(--tx2);width:16px;height:16px}
.lock b{display:block;font-weight:500} .lock small{font-size:12px;line-height:18px;color:var(--tx2)}
.lock a{color:var(--teal);font-weight:500;text-decoration:none;display:none}

/* เงินไปไหน */
.stack{display:flex;gap:2px;height:12px}
.stack i{display:block;border-radius:3px;min-width:2px}
.legend{display:flex;flex-direction:column;gap:6px}
.lg{display:flex;align-items:center;gap:8px}
.lg i{width:8px;height:8px;border-radius:50%;flex:none}
.lg span{flex:1} .lg b{font-weight:500}

/* เดือนนี้ */
#month{display:flex;flex-direction:column;gap:10px;min-width:0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mk{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mk .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.mk .l{font-size:12px;line-height:18px;color:var(--tx2)}
.mk .v{font-size:22px;line-height:30px;font-weight:600}
.mk .s{font-size:12px;line-height:18px;color:var(--tx3)}
.mk .pill{align-self:flex-start;margin-top:2px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;padding-top:6px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;line-height:14px;font-weight:500;color:var(--tx3);cursor:default}
.bcol i{display:block;width:24px;border-radius:3px 3px 0 0;background:var(--teal-m)}
.bcol.cur{color:var(--tx)} .bcol.cur i{background:var(--teal)}
.bcol:hover i,.bcol:focus i{filter:brightness(.92)}

/* กราฟ 30 วัน */
.cleg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;line-height:18px;color:var(--tx2)}
.cleg span{display:flex;align-items:center;gap:5px}
.cleg i{width:8px;height:8px;border-radius:50%}
.cleg u{width:14px;border-top:1.5px dashed var(--gold);text-decoration:none}
.plot,.pstrip,.xax{position:relative;margin-left:32px}
.plot{height:150px}
.gl{position:absolute;left:0;right:0;height:1px;background:var(--bd)}
.gl span{position:absolute;left:-32px;top:-7px;width:26px;text-align:right;font-size:10px;line-height:14px;font-weight:500;color:var(--tx3)}
.cols{position:absolute;inset:0;display:flex;align-items:flex-end}
.col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;outline:none}
.col i{display:block;width:70%;max-width:24px;min-height:2px;border-radius:4px 4px 0 0;background:var(--teal)}
.col.neg i{background:var(--loss)}
.col:hover i,.col:focus i,.pcol:hover i,.pcol:focus i{filter:brightness(1.18)}
.col em{display:none}
.ref{position:absolute;left:0;right:0;border-top:1.5px dashed var(--gold);pointer-events:none}
.xax{height:16px;margin-top:6px}
.xax span{position:absolute;transform:translateX(-50%);font-size:10px;line-height:14px;font-weight:500;color:var(--tx3);white-space:nowrap}
.xax span:first-child{transform:none} .xax span:last-child{transform:translateX(-100%)}

/* สต็อกยา */
.search{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:0 14px}
.search svg{color:var(--tx3)}
.search input{flex:1;border:none;outline:none;font:inherit;color:var(--tx);padding:11px 0;background:none;min-width:0}
.search input::placeholder{color:var(--tx3)}
.search:focus-within{border-color:var(--teal)}
#sres{display:flex;flex-direction:column;gap:10px}
#sres:empty{display:none}
.sr{background:var(--surf);border:1px solid var(--bd);border-left:4px solid var(--tx3);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sr.buy{border-left-color:var(--loss)} .sr.ok{border-left-color:var(--teal)}
.sr-top{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.sr-top div{flex:1;min-width:140px} .sr-top b{font-size:15px;font-weight:600;display:block}
.sr-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sr-g div{background:var(--sub);border-radius:10px;padding:8px;text-align:center}
.sr-g small{display:block;font-size:12px;line-height:18px;color:var(--tx2)} .sr-g b{font-size:15px;font-weight:600}
.banner{display:flex;gap:10px;background:var(--warn-s);border-radius:12px;padding:12px 14px}
.banner svg{color:var(--warn);margin-top:2px}
.banner b{display:block;font-weight:500;color:var(--warn)} .banner small{font-size:12px;line-height:18px;color:var(--tx2)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;line-height:18px;color:var(--tx2)} .kpi .v{font-size:22px;line-height:30px;font-weight:600} .kpi .s{font-size:12px;line-height:18px;color:var(--tx3)}
.medrow{display:flex;flex-direction:column;gap:16px}
.lrow{display:grid;grid-template-columns:1fr auto;column-gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.l-name{grid-column:1;grid-row:1;font-weight:500;min-width:0;overflow-wrap:anywhere}
.l-cap{grid-column:1;grid-row:2;font-size:12px;line-height:18px;color:var(--tx2)}
.l-pill{grid-column:2;grid-row:1 / span 2}
.l-stock,.l-use,.l-order,.l-cost,.lcols{display:none}
.lrow.off .l-name{color:var(--tx3)}
.list.collapsed .lrow.extra{display:none}
.list:not(.collapsed) + .btn .more, .list.collapsed + .btn .less{display:none}
.foot{text-align:center;font-size:12px;color:var(--tx3);padding-top:4px}

/* tooltip */
#tip{position:fixed;z-index:50;display:none;pointer-events:none;background:var(--tx);color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;line-height:18px;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:240px}
#tip div:first-child{font-weight:600;font-size:13px}
#tip div + div{color:#d5e3e1}

/* ---------- Desktop ---------- */
@media (min-width:960px){
  .desk{display:block} .mob{display:none !important}
  body{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
  .side{display:flex;flex-direction:column;justify-content:space-between;background:var(--teal-d);color:var(--on);padding:28px 16px 24px;position:sticky;top:0;height:100vh}
  .side .brand{padding:0 12px 28px} .side .brand b{display:block;font-size:17px;line-height:26px;font-weight:600} .side .brand small{font-size:12px;color:var(--on2)}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--on2);text-align:left}
  .side nav button span{flex:1}
  body[data-page="rev"] .side [data-go="rev"], body[data-page="med"] .side [data-go="med"]{background:var(--teal);color:var(--on)}
  .side .sfoot{padding:0 12px;font-size:12px;line-height:18px;color:var(--on2)} .side .sfoot b{display:block;font-size:14px;line-height:22px;font-weight:500;color:var(--on)}
  .mhead{display:none}
  main{padding:32px;max-width:1240px;width:100%}
  .page{gap:20px}
  .phead{display:flex;align-items:center;gap:16px} .phead div{flex:1} .phead p{color:var(--tx2)}
  .card{border-radius:20px;padding:24px;gap:14px}
  .chead h2,.mhd h2{font-size:17px;line-height:26px}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;order:2}
  #month{order:1} #ncd{order:2} #chart{order:3} #where{order:4}
  .boxes{grid-template-columns:432px repeat(4,minmax(0,1fr));gap:12px}
  .daybox{border-radius:14px;padding:16px 16px 16px 18px}
  .daybox.hero-box{display:flex;align-items:center;gap:18px;background:var(--teal-d);border-left:none;padding:18px 20px}
  .hb-main{flex:1;min-width:0}
  .hb-side{display:flex;flex-direction:column;gap:8px;border-left:1px solid rgba(255,255,255,.18);padding-left:18px}
  .hb-side span{display:block;font-size:12px;line-height:18px;color:var(--on2)}
  .hb-side b{display:block;font-size:22px;line-height:30px;font-weight:600;color:var(--on);white-space:nowrap}
  .hb-side b.sm{font-size:15px;line-height:22px;font-weight:500}
  .daybox.hero-box .db-date,.daybox.hero-box .db-formula,.daybox.hero-box .db-nurse{color:var(--on2)}
  .daybox.hero-box .db-amt{color:var(--on);font-size:40px;line-height:48px;white-space:nowrap}
  .db-amt{font-size:24px;line-height:32px;white-space:nowrap}
  .db-formula{display:block;font-size:12px;line-height:18px;color:var(--tx3)}
  .hist{max-height:300px;padding-right:10px}
  .hcols,.hmonth,.hrow{grid-template-columns:minmax(0,1fr) 160px 120px 120px 120px 140px;grid-template-areas:none}
  .hcols{display:grid;column-gap:8px;background:var(--sub);border-radius:8px;padding:8px 22px 8px 12px;font-size:12px;line-height:18px;font-weight:500;color:var(--tx2)}
  .hcols span:nth-child(n+3){text-align:right}
  .hmonth{background:var(--teal-s);padding:8px 12px} .hmonth b{color:var(--teal-d)}
  .hm-c{display:block;text-align:right;color:var(--tx2)} .hm-c.strong{color:var(--tx);font-weight:500}
  .hmonth .hm-tot{text-align:right;font-size:15px;font-weight:600}
  .hmonth .hm-tot small{display:none}
  .hrow{padding:9px 12px;border-top:none;border-bottom:1px solid var(--bd)}
  .hrow > *{grid-area:auto}
  .h-nurse{font-size:14px;line-height:22px} .h-rev,.h-doc,.h-nc{display:block;text-align:right} .h-doc,.h-nc{color:var(--tx2)}
  .h-rem{font-size:15px;line-height:22px} .h-formula{display:none}
  .mhd{display:flex;align-items:center;gap:10px} .mhd .cap{flex:1;text-align:right}
  #month{gap:12px} .mgrid{gap:16px;flex:1}
  .mk{flex-direction:row;align-items:center;gap:12px;padding:16px 18px}
  .mk .txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0} .mk .v{font-size:28px;line-height:36px}
  .mk .pill{margin-top:6px}
  .bars{width:140px;flex:none}
  .tile b{font-size:28px;line-height:36px}
  .stack{height:14px}
  .legend{flex-direction:row;flex-wrap:wrap;gap:8px 28px} .lg span{flex:none;color:var(--tx2)}
  .chd{display:flex;align-items:flex-start;gap:16px} .chd div:first-child{flex:1}
  .plot{height:220px;margin-left:40px} .pstrip,.xax{margin-left:40px} .gl span{left:-40px;width:32px}
  .col em{display:block;position:absolute;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;line-height:14px;font-weight:500;color:var(--tx);white-space:nowrap}
  .pstrip{height:72px;display:flex}
  .pstrip .zero{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--tx3)}
  .pstrip .zero span{position:absolute;left:-40px;top:-7px;width:32px;text-align:right;font-size:10px;line-height:14px;font-weight:500;color:var(--tx3)}
  .pcol{flex:1;position:relative;height:100%;outline:none}
  .pcol i{position:absolute;left:50%;transform:translateX(-50%);width:70%;max-width:24px;min-height:1.5px;border-radius:2px;background:var(--teal)}
  .pcol.neg i{background:var(--loss)}
  .kgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
  .medrow{display:grid;grid-template-columns:minmax(0,1fr) 412px;gap:16px;align-items:start}
  .lcols,.lrow{grid-template-columns:minmax(0,1fr) 72px 64px 110px 80px 84px;column-gap:8px}
  .lcols{display:grid;background:var(--sub);border-radius:8px;padding:8px 12px;font-size:12px;line-height:18px;font-weight:500;color:var(--tx2)}
  .lcols span:nth-child(n+2){text-align:right}
  .lrow{padding:9px 12px;border-top:none;border-bottom:1px solid var(--bd)}
  .lrow > *{grid-column:auto;grid-row:auto}

/* GLIDE v10: ตัวนอก = ตำแหน่ง (JS transform) · ตัวใน <b> = หน้าตา + การพอง

function laborCard(){
  const days = D.days;
  if (!days.length) return '<div class="card" id="labor"><p class="empty">ยังไม่มีข้อมูลรายได้</p></div>';
  const t0 = days[0];
  const heroBoxes = '<div class="daybox hero-box"><div class="hb-main"><div class="db-date">วันล่าสุด · ' + dFull(t0[0]) + '</div><div class="db-amt">' + baht(rem(t0)) + '</div>'
      + '<div class="db-nurse">' + esc(nurse(t0[4])) + '</div></div>'
    + '<div class="hb-side"><div><span>รายได้รวม</span><b>' + baht(t0[1]) + '</b></div>'
      + '<div><span>หักค่าแรง หมอ + พยาบาล</span><b class="sm">' + baht(-(t0[2] + t0[3])) + '</b></div></div></div>';
  const boxes = heroBoxes + days.slice(1, 5).map(r => {
    const v = rem(r);
    return '<div class="daybox' + (v < 0 ? ' neg' : '') + '">'
      + '<div class="db-date">' + dm(r[0]) + '</div>'
      + '<div class="db-amt">' + baht(v) + '</div>'
      + '<div class="db-formula">' + fmt(r[1]) + ' − ' + fmt(r[2] + r[3]) + '</div>'
      + '<div class="db-nurse">' + esc(nurse(r[4])) + '</div></div>';
  }).join('');
  // สรุปรายเดือนของทุกเดือนที่มีในประวัติ
  const agg = {};
  days.forEach(r => { const k = r[0].slice(0, 7); const a = agg[k] || (agg[k] = {n:0, rev:0, doc:0, nc:0}); a.n++; a.rev += r[1]; a.doc += r[2]; a.nc += r[3]; });
  let rows = '', cur = '';
  days.forEach(r => {
    const k = r[0].slice(0, 7);
    if (k !== cur) {
      cur = k; const a = agg[k], tot = a.rev - a.doc - a.nc;
      rows += '<div class="hmonth"><span><b>' + MON[+k.slice(5) - 1] + ' ' + (+k.slice(0, 4) + 543) + '</b><span class="hm-n">' + a.n + ' วัน</span></span>'
        + '<span class="hm-c"></span><span class="hm-c strong">' + fmt(a.rev) + '</span><span class="hm-c">' + fmt(a.doc) + '</span><span class="hm-c">' + fmt(a.nc) + '</span>'
        + '<span class="hm-tot ' + (tot < 0 ? 'neg' : '') + '"><small>รวม </small>' + baht(tot) + '</span></div>';
    }
    const v = rem(r);
    rows += '<div class="hrow"><span class="h-date">' + dm(r[0]) + '</span><span class="h-nurse">' + esc(nurse(r[4])).replace('พยาบาล ', '<span class="mob">พยาบาล </span>') + '</span>'
      + '<span class="h-rev">' + fmt(r[1]) + '</span><span class="h-doc">' + fmt(r[2]) + '</span><span class="h-nc">' + fmt(r[3]) + '</span>'
      + '<span class="h-rem ' + (v < 0 ? 'neg' : 'pos') + '">' + baht(v) + '</span><span class="h-formula">' + fmt(r[1]) + ' − ' + fmt(r[2] + r[3]) + '</span></div>';
  });
  return '<div class="card" id="labor">'
    + '<div class="chead">' + ic('wallet') + '<h2>คงเหลือหลังหักค่าแรง</h2><span class="cap desk">รายได้ − หมอ − พยาบาล · ยอดที่ใช้โอนเงินหลังบ้าน</span></div>'
    + '<div class="cap mob">รายได้ − หมอ − พยาบาล · ยอดที่ใช้โอนเงินหลังบ้าน</div>'
    + '<div class="boxes">' + boxes + '</div>'
    + '<div class="hist-h"><h2>ย้อนหลัง</h2><span class="cap">เลื่อนดูวันก่อนหน้า</span>' + ic('down').replace('class="ic"', 'class="ic" style="width:14px;height:14px;color:var(--tx3)"') + '</div>'
    + '<div class="hcols"><span>วันที่</span><span>พยาบาล</span><span>รายได้</span><span>ค่าแพทย์</span><span>ค่าพยาบาล</span><span>คงเหลือ</span></div>'
    + '<div class="hist" tabindex="0">' + rows + '</div></div>';
}

function monthBlock(){
  const M = D.months;
  if (!M.length) return '<div id="month"></div>';
  const cur = M[M.length - 1], prev = M.length > 1 ? M[M.length - 2] : null;
  const k1 = v => v == null ? '–' : (Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + 'k' : Math.round(v).toString());
  const defs = [
    {label:'รายได้', val:baht(cur.rev), per:m => m.rev / m.n, sub:m => 'เฉลี่ย ' + baht(m.rev / m.n) + '/วัน', short:k1, tipv:v => 'เฉลี่ย ' + baht(v) + '/วัน'},
    {label:'เงินสดหลังหักค่าแรง', val:baht(cur.remain), per:m => m.remain / m.n, sub:m => 'เฉลี่ย ' + baht(m.remain / m.n) + '/วัน', short:k1, tipv:v => 'เฉลี่ย ' + baht(v) + '/วัน'},
    {label:'กำไร', val:cur.profit == null ? '–' : baht(cur.profit), per:m => m.profit == null ? null : m.profit / m.n, sub:m => m.profit == null ? '' : 'เฉลี่ย ' + baht(m.profit / m.n) + '/วัน', short:k1, tipv:v => 'เฉลี่ย ' + baht(v) + '/วัน'},
    {label:'Margin', val:cur.margin == null ? '–' : cur.margin.toFixed(1) + '%', per:m => m.margin, sub:() => 'กำไร ÷ รายได้', short:v => v == null ? '–' : v.toFixed(1), tipv:v => 'margin ' + v.toFixed(1) + '%', pt:true}
  ];
  const boxes = defs.map(d => {
    const vals = M.map(d.per), a = d.per(cur), b = prev ? d.per(prev) : null;
    let delta = '';
    if (a != null && b != null) {
      if (d.pt) { const x = a - b; delta = Math.abs(x) < 0.05 ? pill('neutral', '≈ เท่า ' + prev.label) : pill(x > 0 ? 'good' : 'loss', (x > 0 ? '▲ ' : '▼ ') + Math.abs(x).toFixed(1) + ' จุด จาก ' + prev.label); }
      else if (b > 0) { const x = (a / b - 1) * 100; delta = Math.abs(x) < 0.5 ? pill('neutral', '≈ เท่า ' + prev.label) : pill(x > 0 ? 'good' : 'loss', (x > 0 ? '▲ ' : '▼ ') + Math.round(Math.abs(x)) + '% จาก ' + prev.label); }
    }
    const mx = Math.max.apply(null, vals.map(v => v == null ? 0 : v).concat([0.0001]));
    const H = 44;
    const bars = M.map((m, i) => {
      const v = vals[i], h = v == null ? 0 : Math.max(3, Math.round(Math.max(v, 0) / mx * H));
      const tip = m.label + ' ' + m.year + (m.complete ? '' : ' (ยังไม่ครบเดือน)') + '|' + (v == null ? 'ไม่มีข้อมูล' : d.tipv(v)) + '|' + m.n + ' วันเปิด';
      return '<span class="bcol' + (m.complete ? '' : ' cur') + '" tabindex="0" data-tip="' + esc(tip) + '">' + d.short(v) + '<i style="height:' + h + 'px"></i>' + m.label + '</span>';
    }).join('');
    return '<div class="mk"><div class="txt"><span class="l">' + d.label + '</span><span class="v">' + d.val + '</span><span class="s">' + d.sub(cur) + '</span>' + delta + '</div><div class="bars">' + bars + '</div></div>';
  }).join('');
  const note = prev ? 'ลูกศรเทียบค่าเฉลี่ยต่อวันกับ ' + prev.label + ' เพราะเดือนนี้ยังไม่ครบ' : '';
  return '<div id="month"><div class="chead mhd"><h2>เดือนนี้ · ' + cur.label + ' ' + cur.year + '</h2>' + pill('warn', cur.n + ' วัน · ยังไม่ครบเดือน') + '<span class="cap desk">' + note + '</span></div>'
    + '<div class="mgrid">' + boxes + '</div><div class="cap mob">' + note + (note ? ' · ' : '') + 'แท่งคือค่าเฉลี่ยต่อวันของแต่ละเดือน</div></div>';
}

function whereCard(){
  const L = D.latest;
  if (!L) return '<div id="where" style="display:none"></div>';
  const parts = [['ค่าแพทย์', L.doc, '--seg-doc'], ['ค่าพยาบาล' + (L.nurse_note && /โบนัส/.test(L.nurse_note) ? ' (รวมโบนัส)' : ''), L.nurse, '--seg-nurse'], ['ต้นทุนยา', L.med, '--seg-med'], ['ค่าใช้จ่ายคงที่', L.ovh, '--seg-ovh']];
  const segs = parts.concat(L.profit > 0 ? [['กำไรสุทธิ', L.profit, '--seg-profit']] : []);
  const stack = segs.filter(p => p[1] > 0).map(p => '<i style="flex:' + p[1] + ' 1 0;background:var(' + p[2] + ')" data-tip="' + esc(p[0] + '|' + baht(p[1]) + '|' + Math.round(p[1] / L.rev * 100) + '% ของรายได้') + '"></i>').join('');
  const lg = parts.map(p => '<div class="lg"><i style="background:var(' + p[2] + ')"></i><span>' + esc(p[0]) + '</span><b>' + baht(p[1]) + '</b></div>').join('')
    + '<div class="lg"><i style="background:var(' + (L.profit >= 0 ? '--seg-profit' : '--loss') + ')"></i><span><b>' + (L.profit >= 0 ? 'กำไรสุทธิ' : 'ขาดทุน') + '</b> · margin ' + L.margin + '%</span><b class="' + (L.profit >= 0 ? '' : 'neg') + '">' + baht(L.profit) + '</b></div>';
  return '<div class="card" id="where"><div class="chead">' + ic('pie') + '<h2>เงิน ' + baht(L.rev) + ' ของวันล่าสุดไปไหน</h2></div><div class="stack">' + stack + '</div><div class="legend">' + lg + '</div></div>';
}

function chartCard(){
  const C = D.chart;
  if (!C.length) return '<div id="chart" style="display:none"></div>';
  const n = C.length, mxRev = Math.max.apply(null, C.map(c => c[1]));
  const step = mxRev > 20000 ? 10000 : 5000, top = Math.max(step, Math.ceil(mxRev / step) * step);
  let gl = '';
  for (let v = 0; v <= top; v += step) gl += '<div class="gl" style="bottom:' + (v / top * 100) + '%"><span>' + (v ? v / 1000 + 'k' : '0') + '</span></div>';
  const iMax = C.reduce((b, c, i) => c[1] > C[b][1] ? i : b, 0);
  const cols = C.map((c, i) => {
    const h = c[1] / top * 100, neg = c[2] < 0;
    const tip = dm(c[0]) + '|รายได้ ' + baht(c[1]) + '|' + (neg ? 'ขาดทุน ' : 'กำไร ') + baht(c[2]);
    const lab = (i === iMax || i === n - 1) ? '<em style="bottom:calc(' + h + '% + 3px)">' + baht(c[1]) + '</em>' : '';
    return '<div class="col' + (neg ? ' neg' : '') + '" tabindex="0" data-tip="' + esc(tip) + '"><i style="height:' + h + '%"></i>' + lab + '</div>';
  }).join('');
  const marks = n > 12 ? [0, Math.floor(n / 2), n - 1] : [0, n - 1];
  const marksD = []; for (let i = 0; i < n - 2; i += 5) marksD.push(i); marksD.push(n - 1);
  const xl = (arr, cls) => arr.map(i => '<span class="' + cls + '" style="left:' + ((i + .5) / n * 100) + '%">' + dShort(C[i][0]) + '</span>').join('');
  const mxP = Math.max.apply(null, C.map(c => Math.abs(c[2])).concat([1]));
  const pcols = C.map(c => {
    const h = Math.abs(c[2]) / mxP * 46, neg = c[2] < 0;
    return '<div class="pcol' + (neg ? ' neg' : '') + '" tabindex="0" data-tip="' + esc(dm(c[0]) + '|' + (neg ? 'ขาดทุน ' : 'กำไร ') + baht(c[2]) + '|รายได้ ' + baht(c[1])) + '"><i style="height:' + h + '%;' + (neg ? 'top:50%' : 'bottom:50%') + '"></i></div>';
  }).join('');
  const win = C.filter(c => c[2] >= 0).length;
  const leg = '<div class="cleg"><span><i style="background:var(--teal)"></i>วันกำไร ' + win + '</span><span><i style="background:var(--loss)"></i>วันขาดทุน ' + (n - win) + '</span><span><u></u>คุ้มทุนโดยประมาณ ' + baht(D.breakeven) + '</span></div>';
  return '<div class="card" id="chart">'
    + '<div class="chd"><div><div class="chead">' + ic('chart') + '<h2>รายได้ ' + n + ' วันล่าสุด</h2></div><div class="cap">สีแท่ง = กำไรหรือขาดทุนของวันนั้นเอง ไม่ได้เทียบกับเส้นคุ้มทุน</div></div><div class="desk">' + leg + '</div></div>'
    + '<div><div class="plot">' + gl + '<div class="cols">' + cols + '</div><div class="ref" style="bottom:' + Math.min(100, D.breakeven / top * 100) + '%"></div></div>'
    + '<div class="xax mob">' + xl(marks, '') + '</div><div class="xax desk">' + xl(marksD, '') + '</div></div>'
    + '<div class="desk"><div class="cap" style="font-weight:500;color:var(--tx2);margin-bottom:6px">กำไร / ขาดทุนรายวัน</div><div class="pstrip"><div class="zero"><span>0</span></div>' + pcols + '</div></div>'
    + '<div class="mob">' + leg + '</div></div>';
}

function searchMed(q){
  const box = $('#sres'); q = q.trim().toUpperCase();
  if (!q) { box.innerHTML = ''; return; }
  const hits = D.med.all.filter(m => m[0] && m[0].toUpperCase().indexOf(q) >= 0).slice(0, 20);
  if (!hits.length) { box.innerHTML = '<p class="empty">ไม่พบยาชื่อนี้ในระบบ</p>'; return; }
  box.innerHTML = hits.map(m => {
    const stock = m[1], use = m[2], sug = m[3], cpu = m[4];
    const left = use > 0 ? Math.floor(stock / use) : null, buy = left !== null && left < 30;
    const cls = use === 0 ? '' : (buy ? 'buy' : 'ok');
    const verdict = use === 0 ? pill('neutral', 'ยังไม่มีข้อมูลการใช้') : (buy ? pill('loss', 'ควรสั่งซื้อ') : pill('good', 'ยังไม่ต้องซื้อ'));
    const order = buy && sug ? baht(sug * cpu) + ' (' + fmt(sug) + ' ชิ้น)' : (buy ? 'ดูคลังก่อน' : '–');
    return '<div class="sr ' + cls + '"><div class="sr-top"><div><b>' + esc(m[0]) + '</b><span class="cap">คงเหลือ ' + fmt(stock) + ' ชิ้น · ใช้ ' + num(use) + ' ชิ้น/วัน</span></div>' + verdict + '</div>'
      + '<div class="sr-g"><div><small>เหลืออีก</small><b class="' + (left === null ? '' : left < 7 ? 'neg' : '') + '">' + (left === null ? '–' : left + ' วัน') + '</b></div><div><small>แนะนำสั่ง</small><b>' + order + '</b></div><div><small>ต้นทุน/ชิ้น</small><b>฿' + cpu.toFixed(2) + '</b></div></div>' + odAddBtn(m[5]) + '</div>';
  }).join('');
}
function renderMed(){
  const m = D.med;

    + '</div>'
    + '<div class="foot">ตรวจสต็อกล่าสุด ' + esc(m.checked) + ' · ยาในคลัง ' + fmt(m.sku) + ' รายการ' + (m.sales ? ' · ใช้/วัน คิดจากยอดขาย ' + esc(m.sales) : '') + '</div>';

/* ================= ORDER PAGE (5 พ.ย. 2569) — หน้าสั่งยา · v3 ซิงก์ Google Sheet ================= */
const OD_KEY = 'clinicOrders.v1', OD_SUP = 'clinicSupOverride.v1', OD_X = 'clinicOrderExtra.v1', OD_CFG = 'clinicOrderApi.v1', OD_OUT = 'clinicOrderOutbox.v1', OD_UNK = 'ยังไม่ระบุบริษัท';
const odLoad = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? (d === undefined ? {} : d) : v; } catch (e) { return d === undefined ? {} : d; } };
const odSave = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const OD = { f: 'todo', items: [], orders: odLoad(OD_KEY), sup: odLoad(OD_SUP), extra: odLoad(OD_X), cfg: odLoad(OD_CFG, null) || (window.ORDER_CFG && window.ORDER_CFG.url ? window.ORDER_CFG : null),
  names: [], received: [], q: '', newName: '', moving: '', newSupFor: '', sync: 'off', syncAt: 0 };
Object.keys(OD.sup).forEach(k => { if (typeof OD.sup[k] === 'string') OD.sup[k] = { s: OD.sup[k] }; });
const odCat = () => (D.med && D.med.catalog) || [];
const odCatOf = k => odCat().find(r => r[0] === k);
const odDays = (st, u) => u > 0 ? Math.floor(st / u) : null;
const odDefQ = r => r[4] || (r[3] > 0 ? Math.ceil(r[3] * 30) : 1);
const odSupName = (k, fb) => (OD.sup[k] && OD.sup[k].s) || fb || '';
const odSupOf = i => i.sup || OD_UNK;
const odCost = i => i.cpu == null ? null : i.q * i.cpu;
const odUnit = i => i.ps ? fmt(Math.ceil(i.q / i.ps)) + (i.pt === 'strip' ? ' แผง' : ' กล่อง') : '';
const odWhen = t => { const d = new Date(t); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function odNames(){
  const s = {};
  (D.med.suppliers || []).concat(OD.names || []).forEach(n => { if (n) s[n] = 1; });
  Object.keys(OD.sup).forEach(k => { const v = OD.sup[k]; if (v && v.s) s[v.s] = 1; });
  Object.keys(OD.extra).forEach(k => { const v = OD.extra[k]; if (v && v.sup) s[v.sup] = 1; });
  return Object.keys(s).sort((a, b) => a.localeCompare(b, 'th'));
}
function odSaveAll(){ odSave(OD_KEY, OD.orders); odSave(OD_SUP, OD.sup); odSave(OD_X, OD.extra); }

/* ---------- ซิงก์ Google Sheet (Apps Script) ---------- */
function odApi(body){
  if (!OD.cfg || !OD.cfg.url) return Promise.reject(new Error('nocfg'));
  return fetch(OD.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin: OD.cfg.pin }, body)) })
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.err || 'error'); return j; });
}
function odPush(ops){
  odSaveAll();
  if (!OD.cfg || !ops.length) return;
  OD.sync = 'saving'; odSyncLine();
  odApi({ action: 'batch', ops: ops })
    .then(() => { OD.sync = 'ok'; OD.syncAt = Date.now(); odSyncLine(); })
    .catch(() => { odSave(OD_OUT, odLoad(OD_OUT, []).concat(ops)); OD.sync = 'err'; odSyncLine(); odToast('บันทึกขึ้น Google Sheet ไม่ได้ — เก็บไว้ในเครื่อง จะส่งให้อีกรอบตอนเปิดหน้า'); });
}
function odPull(){
  if (!OD.cfg) return Promise.resolve();
  OD.sync = 'loading'; odSyncLine();
  const out = odLoad(OD_OUT, []);
  const pre = out.length ? odApi({ action: 'batch', ops: out }).then(() => odSave(OD_OUT, [])) : Promise.resolve();
  return pre.then(() => odApi({ action: 'all' })).then(j => {
    OD.sup = j.sup || {}; OD.orders = j.orders || {}; OD.extra = j.extra || {}; OD.names = j.names || [];
    OD.sync = 'ok'; OD.syncAt = Date.now();
    odSaveAll(); odReconcile(); odBuild(); renderOrd();
  }).catch(e => { OD.sync = 'err'; odSyncLine(); if (String(e && e.message) === 'pin') odToast('PIN ของ Google Sheet ไม่ถูกต้อง'); });
}
function odSyncLine(){
  const el = document.getElementById('odSync'); if (!el) return;
  const st = { off: '', loading: 'กำลังโหลดจาก Google Sheet…', saving: 'กำลังบันทึกขึ้น Google Sheet…',
    ok: 'ซิงก์กับ Google Sheet แล้ว ✓' + (OD.syncAt ? ' ' + odWhen(OD.syncAt) : ''), err: '⚠ ซิงก์ไม่ได้ — ใช้ข้อมูลในเครื่องไปก่อน' }[OD.sync] || '';
  el.innerHTML = esc(st) + ' · <button class="od-x" data-odpull="1">รีเฟรช</button> · <button class="od-x" data-odlink="1">คัดลอกลิงก์ตั้งค่าเครื่องอื่น</button>';
}
function odSetupHtml(){
  if (OD.cfg) return '<div class="foot" id="odSync"></div>';
  return '<details class="od-more od-setup"><summary>เชื่อม Google Sheet — ตอนนี้ข้อมูลจำไว้แค่ในเครื่องนี้</summary>'
    + '<div class="od-new"><input class="full" id="odCu" placeholder="URL ของ Apps Script (ลงท้าย /exec)" autocomplete="off"><input id="odCp" placeholder="PIN" inputmode="numeric" autocomplete="off">'
    + '<button class="od-btn" data-odcfg="1">เชื่อม</button></div></details>';
}
function odSetupFromHash(){
  const m = /^#ordsetup=(.+)$/.exec(location.hash || '');
  if (!m) return;
  try { const c = JSON.parse(decodeURIComponent(escape(atob(m[1])))); if (c && c.url) { OD.cfg = { url: c.url, pin: String(c.pin || '') }; odSave(OD_CFG, OD.cfg); } } catch (e) {}
  document.body.dataset.page = 'ord';   // คงลิงก์ #ordsetup ไว้ — iPhone เพิ่มลงหน้าจอโฮมจากลิงก์นี้แล้วเชื่อมเองทุกครั้งที่เปิด
}

/* ---------- สถานะ ---------- */
function odReconcile(){
  const list = (D.med && D.med.order) || [], now = Date.now(), ops = [];
  Object.keys(OD.orders).forEach(k => {
    const o = OD.orders[k], r = odCatOf(k), it = list.find(x => x.k === k);
    const cur = r ? r[2] : (it ? it.s : null);
    const got = cur != null && o.s != null && cur > o.s;
    if (got || now - o.t > 21 * 864e5) {
      if (got) OD.received.push(o.n || k);
      delete OD.orders[k]; ops.push({ kind: 'order', key: k, val: null });
      if (OD.extra[k]) { delete OD.extra[k]; ops.push({ kind: 'extra', key: k, val: null }); }
    }
  });
  if (ops.length) odPush(ops); else odSaveAll();
}
function odInit(){
  odSetupFromHash();
  odReconcile(); odBuild();
  setTimeout(odPull, 0);
}
function odBuild(){
  const list = (D.med && D.med.order) || [], keep = {};
  OD.items.forEach(i => { keep[i.k] = i; });
  const mk = (x, extra) => {
    const o = keep[x.k], sp = OD.sup[x.k] || {};
    const cpu = x.cpu != null ? x.cpu : (sp.c ? +sp.c : null);
    return Object.assign({}, x, extra || {}, { sup: odSupName(x.k, x.sup), ps: sp.ps ? +sp.ps : x.ps, pt: sp.pt || x.pt,
      cpu: cpu, est: x.cpu != null ? x.est : !!sp.c, q: o ? o.q : x.o, sel: o ? o.sel : true });
  };
  const items = list.filter(x => !(OD.sup[x.k] && OD.sup[x.k].stop)).map(x => mk(x));
  Object.keys(OD.extra).forEach(k => {
    if (items.some(i => i.k === k)) return;
    const e = OD.extra[k];
    if (e.nw) { items.push(mk({ n: e.n, k: k, s: null, u: 0, d: null, o: e.q, cpu: e.c ? +e.c : null, est: !!e.c, sup: e.sup || '', ps: null, pt: null }, { x: 'new' })); return; }
    const r = odCatOf(k); if (!r) return;
    items.push(mk({ n: r[1], k: k, s: r[2], u: r[3], d: odDays(r[2], r[3]), o: e.q || odDefQ(r), cpu: r[5], est: false, sup: r[6] || '', ps: r[7], pt: r[8] }, { x: 'add' }));
  });
  OD.items = items;
}
function odAdd(k, q){
  if (!OD.extra[k] && !OD.items.some(i => i.k === k)) {
    const r = odCatOf(k); OD.extra[k] = { q: q || (r ? odDefQ(r) : 1), t: Date.now() };
    odPush([{ kind: 'extra', key: k, val: OD.extra[k] }]);
  }
  odBuild();
  const it = OD.items.find(i => i.k === k); if (it) it.sel = true;
  renderOrd();
  const r = odCatOf(k); odToast('เพิ่ม ' + (r ? r[1] : k) + ' ในรายการสั่ง');
}
function odAddBtn(k){
  if (!k || !odCatOf(k)) return '';
  return '<button class="od-btn" data-odadd="' + esc(k) + '" data-gotoord="1">+ ใส่ในรายการสั่ง</button>';
}
function odSetSup(i, name){
  name = String(name || '').trim(); if (!name) return;
  if (i.x === 'new') { OD.extra[i.k].sup = name; odPush([{ kind: 'extra', key: i.k, val: OD.extra[i.k] }]); }
  else { OD.sup[i.k] = Object.assign({}, OD.sup[i.k] || {}, { s: name, n: i.n }); odPush([{ kind: 'sup', key: i.k, val: OD.sup[i.k] }]); }
  if (OD.names.indexOf(name) < 0) OD.names.push(name);
  OD.moving = ''; OD.newSupFor = ''; odBuild(); renderOrd(); odToast('ย้าย ' + i.n + ' ไป ' + name);
}
function odSupSelect(x, cur){
  return '<select class="od-as" data-odas="' + x + '"><option value="">' + (cur ? 'ย้ายไป…' : 'เลือกบริษัท…') + '</option>'
    + odNames().filter(s => s !== cur).map(s => '<option>' + esc(s) + '</option>').join('') + '<option value="__new">+ บริษัทใหม่…</option></select>';
}

/* ---------- วาดหน้า ---------- */
function odGroups(){
  const g = {};
  OD.items.forEach(i => { (g[odSupOf(i)] = g[odSupOf(i)] || []).push(i); });
  return Object.keys(g).map(k => {
    const its = g[k].slice().sort((a, b) => (a.d == null ? 999 : a.d) - (b.d == null ? 999 : b.d));
    const open = its.filter(i => !OD.orders[i.k]), ord = its.filter(i => OD.orders[i.k]);
    return { name: k, items: its, open: open, ord: ord, min: Math.min.apply(null, open.map(i => i.d == null ? 999 : i.d).concat([999])) };
  }).sort((a, b) => ((a.name === OD_UNK) - (b.name === OD_UNK)) || (a.min - b.min) || (b.items.length - a.items.length));
}
function odBadge(G){
  const n = G.filter(g => g.open.some(i => !i.x && i.d != null && i.d <= 7)).length;
  document.querySelectorAll('[data-ordbadge]').forEach(b => { b.textContent = n; b.style.display = n ? '' : 'none'; });
}
function odDayPill(i){
  if (i.s == null) return '';
  if (i.x && (i.d == null || i.d > 30)) return pill('neutral', i.d == null ? 'ไม่มียอดใช้' : 'เหลือ ' + i.d + ' วัน');
  return i.s <= 0 ? pill('loss', 'หมดแล้ว') : (i.d != null && i.d <= 7 ? pill('loss', 'เหลือ ' + i.d + ' วัน') : pill('warn', 'เหลือ ' + (i.d == null ? '–' : i.d) + ' วัน'));
}
function odRow(i){
  const x = OD.items.indexOf(i), unk = !i.sup, c = odCost(i);
  let supUi = '';
  if (OD.newSupFor === i.k) supUi = '<span class="od-ns"><input class="od-as" data-odnsin="' + x + '" placeholder="ชื่อบริษัทใหม่"><button class="od-x" data-odnsok="' + x + '">บันทึก</button></span>';
  else if (unk || OD.moving === i.k) supUi = ' · ' + odSupSelect(x, i.sup);
  else supUi = '<button class="od-x" data-odmove="' + esc(i.k) + '">ย้ายบริษัท</button>';
  return '<div class="od-it' + (i.sel ? '' : ' off') + '">'
    + '<button class="od-ck' + (i.sel ? ' on' : '') + '" data-odck="' + x + '" aria-label="เลือก ' + esc(i.n) + '">' + (i.sel ? '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>' : '') + '</button>'
    + '<div class="od-nm">' + esc(i.n) + (i.x === 'new' ? '<span class="od-tag new">ยาใหม่</span>' : i.x ? '<span class="od-tag">เพิ่มเอง</span>' : '') + '</div>'
    + '<div class="od-q"><div class="od-step"><button data-odb="' + x + '" data-dir="-1" aria-label="ลด">−</button><input inputmode="numeric" data-odq="' + x + '" value="' + i.q + '"><button data-odb="' + x + '" data-dir="1" aria-label="เพิ่ม">+</button></div>'
    + '<small>' + (c == null ? 'ไม่รู้ทุน' : (i.est ? '≈' : '') + baht(c)) + (odUnit(i) ? ' · ' + odUnit(i) : '') + '</small></div>'
    + '<div class="od-cap">' + odDayPill(i) + (i.s == null ? 'ยังไม่เคยมีในคลัง' : 'เหลือ ' + fmt(i.s) + ' · ใช้ ' + num(i.u) + '/วัน') + supUi
    + (i.x ? '<button class="od-x" data-odrm="' + esc(i.k) + '">เอาออก</button>' : '') + '</div></div>';
}
function odMore(g){
  const have = {}; OD.items.forEach(i => { have[i.k] = 1; });
  const c = odCat().filter(r => odSupName(r[0], r[6]) === g.name && !have[r[0]] && r[3] > 0 && !(OD.sup[r[0]] && OD.sup[r[0]].stop))
    .map(r => [r, odDays(r[2], r[3])]).filter(x => x[1] != null && x[1] <= 60).sort((a, b) => a[1] - b[1]);
  if (!c.length) return '';
  return '<details class="od-more"><summary>สั่งพ่วง: ยาอื่นของเจ้านี้ที่จะหมดใน 60 วัน (' + c.length + ')</summary>'
    + c.map(x => '<div class="od-r"><div class="t"><b>' + esc(x[0][1]) + '</b><small>เหลือ ' + fmt(x[0][2]) + ' · ใช้ ' + num(x[0][3]) + '/วัน · อีก ' + x[1] + ' วัน</small></div>'
      + '<button class="od-plus" data-odadd="' + esc(x[0][0]) + '" aria-label="เพิ่ม">+</button></div>').join('') + '</details>';
}
function odCard(g){
  const unk = g.name === OD_UNK, sel = g.open.filter(i => i.sel && i.q > 0);
  const tot = sel.reduce((s, i) => s + (odCost(i) || 0), 0), est = sel.some(i => i.est || i.cpu == null);
  const urg = g.open.filter(i => i.d != null && i.d <= 7).length;
  const badge = !g.open.length ? pill('neutral', 'รอรับของ') : urg ? pill('loss', 'ด่วน ' + urg) : g.min < 999 ? pill('warn', 'ภายใน ' + g.min + ' วัน') : pill('neutral', 'เพิ่มเอง');
  const first = g.ord.length ? Math.min.apply(null, g.ord.map(i => OD.orders[i.k].t)) : 0;
  const done = g.ord.length ? '<div class="od-done"><div><b>สั่งแล้ว · รอรับของ (' + g.ord.length + ')</b>สั่งเมื่อ ' + odWhen(first) + ' · ระบบจะเคลียร์เองเมื่อสต็อกเพิ่ม'
      + '<ul>' + g.ord.map(i => '<li>' + esc(i.n) + ' — ' + fmt(OD.orders[i.k].q || i.q) + '</li>').join('') + '</ul></div>'
      + '<button class="od-btn" data-odundo="' + esc(g.name) + '">ยกเลิก</button><button class="od-btn" data-odrecv="' + esc(g.name) + '">ได้รับแล้ว</button></div>' : '';
  const ini = unk ? '?' : (g.name.replace(/^ยี่ปั้ว\s*/, '').trim()[0] || '?').toUpperCase();
  return '<section class="card od-card' + (unk ? ' od-unk' : '') + '">'
    + '<div class="od-sh"><div class="od-av">' + esc(ini) + '</div><div class="t"><b>' + esc(g.name) + '</b><small>' + (unk ? 'เลือกบริษัทแล้วยาจะย้ายไปการ์ดนั้น · บันทึกถาวร' : g.items.length + ' รายการ') + '</small></div>' + badge + '</div>'
    + done
    + (g.open.length ? '<div class="od-items">' + g.open.map(odRow).join('') + '</div>'
      + (unk ? '' : odMore(g))
      + (unk ? '' : '<div class="od-ft"><div class="tot">รวม' + (est ? ' (ประมาณ)' : '') + '<b>' + baht(tot) + '</b></div>'
        + '<button class="od-btn" data-odmark="' + esc(g.name) + '">สั่งแล้ว</button>'
        + '<button class="od-btn line" data-odline="' + esc(g.name) + '"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8-6C21.4 14.2 22 12.7 22 11c0-4.4-4.5-8-10-8z"/></svg>ส่งทาง LINE</button></div>') : '')
    + '</section>';
}
function odSearch(){
  const box = document.getElementById('odRes'); if (!box) return;
  const q = OD.q.trim().toUpperCase();
  if (!q) { box.innerHTML = ''; return; }
  const have = {}; OD.items.forEach(i => { have[i.k] = 1; });
  const hits = odCat().filter(r => r[1].toUpperCase().indexOf(q) >= 0).slice(0, 8);

  };
  const aim = a => { tgt = a; if (!raf) raf = requestAnimationFrame(tick); };
  addEventListener('scroll', () => aim(135 + Math.sin(scrollY / 240) * 40), { passive: true });
  addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return;
    aim(Math.atan2(e.clientX - innerWidth / 2, -(e.clientY - innerHeight / 2)) * 180 / Math.PI); }, { passive: true });
  addEventListener('deviceorientation', e => { if (e.gamma == null) return; aim(135 + e.gamma * 1.6 + (e.beta - 45) * 0.6); });
})();
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const t = e.target.closest('[data-toggle]'); if (t) { document.getElementById(t.dataset.toggle).classList.toggle('collapsed'); }
});
const tip = $('#tip');
function showTip(el, x, y){
  tip.textContent = '';
  el.dataset.tip.split('|').forEach(line => { const d = document.createElement('div'); d.textContent = line; tip.appendChild(d); });
  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x - w / 2, innerWidth - w - 8)) + 'px';
  tip.style.top = (y - h - 12 < 8 ? y + 18 : y - h - 12) + 'px';
}
function onPoint(e){ const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el) showTip(el, e.clientX, e.clientY); else tip.style.display = 'none'; }
document.addEventListener('pointermove', onPoint);
document.addEventListener('pointerdown', onPoint);
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } });
document.addEventListener('focusout', () => { tip.style.display = 'none'; });
window.addEventListener('scroll', () => { tip.style.display = 'none'; }, true);

document.querySelectorAll('[data-clinic]').forEach(e => e.textContent = D.clinic);
document.querySelectorAll('[data-updated]').forEach(e => e.textContent = D.updated);
document.querySelectorAll('[data-updated-short]').forEach(e => e.textContent = D.updated.replace(/ \d{4} · /, ' '));

/* ---------- ปุ่มรีเฟรชเดี๋ยวนี้ → Apps Script → GitHub Actions ---------- */
const RF = { busy: false, t0: 0 };
function rfSet(state, txt){
  document.querySelectorAll('[data-refresh]').forEach(b => {
    b.dataset.state = state || '';
    const t = b.querySelector('[data-rf-t]');
    if (!t) return;
    if (!t.dataset.orig) t.dataset.orig = t.textContent;
    t.textContent = txt == null ? t.dataset.orig : txt;
  });
}
function rfFail(msg){ RF.busy = false; rfSet('', null); odToast(msg); }
function rfStart(){
  if (RF.busy) return;
  if (!OD.cfg || !OD.cfg.url) { odToast('ยังไม่ได้เชื่อม Google Sheet — เปิดลิงก์ตั้งค่าในเครื่องนี้ก่อน'); return; }
  RF.busy = true; RF.t0 = Date.now(); rfSet('run', 'กำลังดึง…');
  odApi({ action: 'refresh' }).then(j => {
    odToast(j.running ? 'กำลังอัปเดตอยู่แล้ว รอสักครู่' : 'สั่งอัปเดตแล้ว ใช้เวลา ~1–2 นาที');
    rfPoll(j.running && j.run ? { target: j.run.id } : { prev: j.prev || 0 });
  }).catch(e => rfFail(/no_token/.test(e.message) ? 'ยังไม่ได้ใส่ GH_TOKEN ใน Apps Script' : 'สั่งอัปเดตไม่สำเร็จ (' + e.message + ')'));
}
function rfPoll(w){
  if (Date.now() - RF.t0 > 6 * 60e3) return rfFail('รอนานเกินไป — ลองเปิดหน้าใหม่ภายหลัง');
  setTimeout(() => {
    odApi({ action: 'runstatus' }).then(j => {
      const r = j.run;
      const mine = r && (w.target ? r.id === w.target : r.id !== w.prev);
      if (!mine || r.status !== 'completed') return rfPoll(w);
      if (r.conclusion !== 'success') return rfFail('อัปเดตไม่สำเร็จ (' + r.conclusion + ') — ดูที่ GitHub Actions');
      if (location.protocol === 'file:') { RF.busy = false; rfSet('ok', 'อัปเดตบนเว็บแล้ว'); return; }
      rfSet('ok', 'เสร็จแล้ว กำลังโหลด…'); rfWaitPage();
    }).catch(() => rfPoll(w));
  }, 8000);
}
function rfWaitPage(){
  // GitHub Pages ใช้เวลาอีก ~30–60 วิ กว่าหน้าใหม่จะขึ้น
  const until = Date.now() + 3 * 60e3;
  (function tick(){
    fetch(location.pathname + '?rf=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(h => {
      if (h.indexOf(JSON.stringify(D.updated).slice(1, -1)) < 0 || Date.now() > until) location.reload();
      else setTimeout(tick, 6000);
    }).catch(() => setTimeout(tick, 6000));
  })();
}
document.querySelectorAll('[data-refresh]').forEach(b => b.addEventListener('click', rfStart));
document.querySelectorAll('[data-window]').forEach(e => e.textContent = 'ประวัติรายวัน ' + D.days.length + ' วัน');
renderRev(); renderMed(); odInit(); renderOrd();
if (location.hash === '#med' || location.hash === '#ord') document.body.dataset.page = location.hash.slice(1);
placeGlide(false);
requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.glide.no-tr').forEach(g => g.classList.remove('no-tr'))));
if (document.fonts) document.fonts.ready.then(() => placeGlide(false));
})();
</script>
